apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-pvc
  namespace: gitlab
spec:
  storageClassName: ""  # Empty string to match PV with no storage class
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # GitLab requires more storage (50GB minimum recommended)
  # Note: This PVC binds to gitlab-pv-local PV using hostPath
  # For single-node clusters, hostPath is acceptable



