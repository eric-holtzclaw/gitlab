apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-config
  namespace: gitlab
data:
  # GitLab Configuration
  # See: https://docs.gitlab.com/ee/administration/environment_variables.html
  GITLAB_OMNIBUS_CONFIG: |
    external_url 'http://localhost:8080'
    # Disable Let's Encrypt for internal deployment
    letsencrypt['enable'] = false
    # GitLab will be accessible via port-forward or LoadBalancer
    nginx['listen_port'] = 80
    # SSH configuration
    gitlab_rails['gitlab_shell_ssh_port'] = 2222
    # Email configuration (optional - adjust as needed)
    gitlab_rails['gitlab_email_enabled'] = false
    # Performance tuning
    puma['worker_processes'] = 2
    puma['min_threads'] = 4
    puma['max_threads'] = 8
    # Database (built-in PostgreSQL)
    postgresql['shared_buffers'] = "256MB"
    # Redis (built-in)
    redis['maxmemory'] = "256mb"
    redis['maxmemory_policy'] = "allkeys-lru"
    # Prometheus monitoring
    prometheus_monitoring['enable'] = true
    prometheus['listen_address'] = '0.0.0.0'
    prometheus['listen_port'] = 9090
    prometheus['external_url'] = 'http://localhost:8080'
    # Grafana disabled (not supported in GitLab CE)


