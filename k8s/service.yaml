apiVersion: v1
kind: Service
metadata:
  name: gitlab-service
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: ClusterIP  # Internal only (use port-forward or LoadBalancer for external)
  selector:
    app: gitlab
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http
  - protocol: TCP
    port: 443
    targetPort: 443
    name: https
  - protocol: TCP
    port: 2222
    targetPort: 2222
    name: ssh



